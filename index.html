<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ff6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darna">
<title>Darna</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700;800;900&family=Cairo:wght@600;700;800;900&display=swap">
<style>
/* Darna ("our home"): three siblings in Fez, New York and Doha saving for one apartment in Morocco.
   IDEA: a Moroccan house whose windows light up as the family fund grows.
   COLOUR: Majorelle blue, terracotta, sand, zellige gold; each sibling has a colour of their own.
   TYPE: Fraunces for the dream, Nunito / Cairo for everything you read.
   LAYOUT: one column, phone first; the house picture on top, actions under it, details below. */
:root {
  --bg: #fff8ef; --card: #ffffff; --soft: #fff1e0; --ink: #2a2140; --muted: #7a6f86; --line: #f3e2cc;
  --blue: #4b5cff; --blue-2: #3443d6; --terra: #ff6b4a; --gold: #ffb703; --teal: #12b39a; --red: #e5484d; --pink: #ff4f8b; --purple: #7b5cff; --on: #ffffff;
  --shadow: 0 8px 24px rgba(255, 107, 74, .10); --hero: linear-gradient(135deg, #ff9a3c 0%, #ff5e7e 52%, #7b5cff 100%); --input: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16122a; --card: #211b3a; --soft: #2c2550; --ink: #f7f3ff; --muted: #b9b0d0; --line: #3a3163;
    --blue: #8f9bff; --blue-2: #6f7cf0; --terra: #ff8a6b; --gold: #ffc94d; --teal: #3ee0c4; --red: #ff7a70; --pink: #ff7aa6; --purple: #a08cff; --on: #16122a;
    --shadow: 0 8px 24px rgba(0, 0, 0, .45); --hero: linear-gradient(135deg, #e8742a 0%, #d63d6c 52%, #5a3fd6 100%); --input: #1b1631;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16122a; --card: #211b3a; --soft: #2c2550; --ink: #f7f3ff; --muted: #b9b0d0; --line: #3a3163;
  --blue: #8f9bff; --blue-2: #6f7cf0; --terra: #ff8a6b; --gold: #ffc94d; --teal: #3ee0c4; --red: #ff7a70; --pink: #ff7aa6; --purple: #a08cff; --on: #16122a;
  --shadow: 0 8px 24px rgba(0, 0, 0, .45); --hero: linear-gradient(135deg, #e8742a 0%, #d63d6c 52%, #5a3fd6 100%); --input: #1b1631;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--gold) 20%, transparent), transparent 42%), radial-gradient(circle at 100% 35%, color-mix(in srgb, var(--pink) 12%, transparent), transparent 45%), radial-gradient(circle at 0% 90%, color-mix(in srgb, var(--teal) 12%, transparent), transparent 45%), var(--bg); background-attachment: fixed; color: var(--ink); font-family: "Nunito", "Cairo", -apple-system, system-ui, "Segoe UI", sans-serif; font-size: 15.5px; line-height: 1.55;
  padding: env(safe-area-inset-top, 0px) 0 calc(86px + env(safe-area-inset-bottom, 0px)); }
:root[dir="rtl"] body { font-family: "Cairo", "Nunito", -apple-system, system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
bdi { unicode-bidi: isolate; }
.wrap { max-width: 640px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 14px max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 2px 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 40px; height: 40px; border-radius: 12px; flex: none; }
.brand-name { font-family: "Fraunces", "Cairo", serif; font-weight: 800; font-size: 22px; line-height: 1.1; }
.brand-sub { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-r { display: flex; gap: 6px; align-items: center; flex: none; }
.pill-btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-weight: 800; font-size: 13px; cursor: pointer; }
.sync-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.sync-dot.ok { background: var(--teal); } .sync-dot.busy { background: var(--gold); } .sync-dot.err { background: var(--red); }
.tab { display: none; } .tab.on { display: block; animation: rise .3s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card h3 { font-size: 16.5px; font-weight: 900; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 small { font-size: 12.5px; color: var(--muted); font-weight: 800; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-top: 6px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: none; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--soft); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.stat small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 800; }
.stat b { font-size: 19px; font-weight: 900; }
.bar { height: 10px; border-radius: 10px; background: var(--soft); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; transition: width .6s ease; }
.bar > i.one { border-radius: 10px; background: linear-gradient(90deg, var(--terra), var(--gold)); }
label { display: block; font-size: 12.5px; font-weight: 800; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { width: 100%; padding: 12px 13px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--input); font-size: 16px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--terra); }
.fg { margin-bottom: 12px; min-width: 0; }
.btn { display: block; width: 100%; border: none; border-radius: 15px; padding: 13px 14px; font-weight: 900; font-size: 15.5px; cursor: pointer; text-align: center; transition: transform .08s; }
.btn:active { transform: scale(.97); }
.btn-main { background: linear-gradient(135deg, var(--terra), var(--pink)); color: #fff; box-shadow: 0 8px 20px color-mix(in srgb, var(--pink) 35%, transparent); }
.btn-terra { background: linear-gradient(135deg, var(--purple), var(--blue)); color: #fff; }
.btn-soft { background: var(--soft); color: var(--ink); }
.btn-sm { padding: 9px 12px; font-size: 13.5px; border-radius: 12px; }
.seg { display: flex; background: var(--soft); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: none; background: transparent; border-radius: 11px; padding: 9px 4px; font-weight: 800; font-size: 13px; cursor: pointer; color: var(--muted); min-width: 0; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

/* the house */
.dream { position: relative; border-radius: 26px; overflow: hidden; color: #fff; background: var(--hero); min-height: 260px; box-shadow: var(--shadow); margin-bottom: 14px; }
.dream-photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
.dream::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(40, 15, 40, .78) 0%, rgba(40, 15, 40, .25) 55%, rgba(40, 15, 40, 0) 100%); pointer-events: none; }
.dream.nophoto::after { background: none; }
.dream.nophoto .dream-photo { background-image: radial-gradient(circle at 20px 20px, rgba(255,255,255,.16) 3px, transparent 4px), radial-gradient(circle at 85% 15%, rgba(255, 215, 120, .55), transparent 30%); background-size: 40px 40px, 100% 100%; }
.dream-in { position: relative; z-index: 1; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 260px; gap: 8px; }
.dream-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.dream-title { font-family: "Fraunces", "Cairo", serif; font-size: 25px; font-weight: 800; line-height: 1.2; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
.dream-city { font-size: 13px; font-weight: 800; opacity: .9; }
.photo-btn { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 99px; padding: 6px 11px; font-size: 12.5px; font-weight: 800; cursor: pointer; flex: none; }
.dream-nums { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.dream-pct { font-family: "Fraunces", "Nunito", serif; font-size: clamp(40px, 13vw, 54px); font-weight: 800; line-height: 1; }
.dream-saved { text-align: end; font-weight: 800; font-size: 14px; line-height: 1.5; }
.dream-saved b { font-size: 21px; }
.dream .bar { background: rgba(255,255,255,.28); height: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
.dream .bar > i { box-shadow: inset -2px 0 0 rgba(255,255,255,.6); }
/* the house that builds itself */
.house { display: block; width: 100%; max-width: 420px; height: auto; margin: 2px auto 0; overflow: visible; }
.house .p { opacity: 0; transform: translateY(8px) scale(.94); transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .7s ease, transform .8s cubic-bezier(.2, 1.4, .4, 1); }
.house .p.on { opacity: 1; transform: none; }
#fillLine { filter: drop-shadow(0 0 4px #ffb703); }
.burst { position: absolute; left: 50%; top: 46%; z-index: 3; transform: translate(-50%, 0); font-weight: 900; font-size: 26px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.35), 0 0 18px #ffb703; pointer-events: none; white-space: nowrap; direction: ltr; unicode-bidi: isolate; animation: burst 2.2s ease-out forwards; }
@keyframes burst { 0% { opacity: 0; transform: translate(-50%, 30px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 70% { opacity: 1; transform: translate(-50%, -40px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(.95); } }
.house.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { filter: none; } 25% { filter: drop-shadow(0 0 18px #ffd166) brightness(1.15); } 100% { filter: none; } }
.house .sun { animation: sun 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sun { 50% { transform: scale(1.08); } }
.house .heart.on { animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } }
.stage { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); border-radius: 99px; padding: 4px 11px; font-size: 12.5px; font-weight: 900; }
/* streak */
.streak { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 26%, var(--card)), color-mix(in srgb, var(--terra) 16%, var(--card))); border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line)); border-radius: 18px; padding: 11px 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.streak .fire { font-size: 28px; line-height: 1; }
.streak b { font-size: 15px; font-weight: 900; display: block; }
.streak span { font-size: 12.5px; color: var(--muted); font-weight: 800; }
/* rooms */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.room { position: relative; border-radius: 16px; padding: 12px 6px 10px; text-align: center; background: var(--soft); border: 1.5px dashed var(--line); cursor: pointer; min-width: 0; }
.room .ri { font-size: 28px; line-height: 1.1; display: block; filter: grayscale(1); opacity: .45; }
.room .rn { font-size: 12.5px; font-weight: 900; display: block; margin-top: 4px; }
.room .rs { font-size: 11px; font-weight: 800; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room.open { border-style: solid; background: linear-gradient(160deg, color-mix(in srgb, var(--gold) 22%, var(--card)), var(--card)); border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
.room.open .ri { filter: none; opacity: 1; }
.room.mine, .room.taken { background: linear-gradient(160deg, color-mix(in srgb, var(--mc) 22%, var(--card)), var(--card)); border-color: color-mix(in srgb, var(--mc) 50%, var(--line)); }
.room .own { position: absolute; top: 6px; inset-inline-end: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--mc); color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center; }
/* family messages */
.wall .msg { display: flex; gap: 9px; align-items: flex-start; padding: 9px 0; }
.wall .bub { flex: 1; min-width: 0; background: color-mix(in srgb, var(--mc) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--mc) 28%, var(--line)); border-radius: 4px 16px 16px 16px; padding: 8px 11px; }
:root[dir="rtl"] .wall .bub { border-radius: 16px 4px 16px 16px; }
.wall .msg.me { flex-direction: row-reverse; }
.wall .msg.me .bub { border-radius: 16px 4px 16px 16px; }
:root[dir="rtl"] .wall .msg.me .bub { border-radius: 4px 16px 16px 16px; }
.wall .mwho { font-size: 12px; font-weight: 900; color: var(--mc); }
.wall .tx { font-size: 15px; overflow-wrap: anywhere; white-space: pre-wrap; }
.wall .big { font-size: 30px; line-height: 1.2; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chips button { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 5px 11px; font-size: 18px; cursor: pointer; }
.send { display: flex; gap: 8px; }
.send input { flex: 1; min-width: 0; }
.send button { flex: none; width: auto; padding: 0 16px; }
/* daily welcome */
.welcome { text-align: center; }
.welcome .wh { font-size: 54px; line-height: 1; margin: 4px 0 6px; }
.welcome .wg { font-family: "Fraunces", "Cairo", serif; font-size: 24px; font-weight: 800; }
.welcome .wm { font-family: "Fraunces", "Cairo", serif; font-size: 18px; font-weight: 600; line-height: 1.6; margin: 12px 4px 14px; }
.welcome .wst { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }

/* siblings */
.fam { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-bottom: 14px; }
.mem { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow); min-width: 0; position: relative; }
.mem.me { border: 2px solid var(--mc); }
.av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 18px; color: #fff; background: var(--mc); margin: 0 auto 6px; }
.mem .nm { font-weight: 900; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mem .amt { font-weight: 900; font-size: 15.5px; }
.mem .sub { font-size: 11.5px; color: var(--muted); font-weight: 800; line-height: 1.4; }
.mem .pl { height: 6px; border-radius: 6px; background: var(--soft); margin-top: 6px; overflow: hidden; }
.mem .pl i { display: block; height: 100%; background: var(--mc); }
.quote { font-family: "Fraunces", "Cairo", serif; font-size: 17px; font-weight: 600; line-height: 1.6; }
.quote-card { background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 30%, var(--card)), color-mix(in srgb, var(--pink) 12%, var(--card))); border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
.tint-mint { background: linear-gradient(160deg, color-mix(in srgb, var(--teal) 14%, var(--card)), var(--card) 70%); border-color: color-mix(in srgb, var(--teal) 30%, var(--line)); }
.tint-purple { background: linear-gradient(160deg, color-mix(in srgb, var(--purple) 13%, var(--card)), var(--card) 70%); border-color: color-mix(in srgb, var(--purple) 28%, var(--line)); }
.tint-pink { background: linear-gradient(160deg, color-mix(in srgb, var(--pink) 11%, var(--card)), var(--card) 70%); border-color: color-mix(in srgb, var(--pink) 26%, var(--line)); }
.stat:nth-child(1) { background: color-mix(in srgb, var(--terra) 14%, var(--card)); } .stat:nth-child(2) { background: color-mix(in srgb, var(--purple) 14%, var(--card)); }
.stat:nth-child(3) { background: color-mix(in srgb, var(--teal) 15%, var(--card)); } .stat:nth-child(4) { background: color-mix(in srgb, var(--gold) 20%, var(--card)); }
.mem { background: linear-gradient(180deg, color-mix(in srgb, var(--mc) 16%, var(--card)), var(--card) 65%); border-color: color-mix(in srgb, var(--mc) 30%, var(--line)); }
.mem .done { position: absolute; top: 8px; inset-inline-end: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--mc); color: #fff; font-size: 12px; font-weight: 900; display: grid; place-items: center; }
.av { box-shadow: 0 4px 12px color-mix(in srgb, var(--mc) 45%, transparent); }
.heart { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 3px 9px; font-size: 12.5px; cursor: pointer; flex: none; font-weight: 800; color: var(--muted); }
.heart.on { background: color-mix(in srgb, var(--pink) 15%, var(--card)); border-color: color-mix(in srgb, var(--pink) 40%, var(--line)); color: var(--pink); }
.months { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 10px; }
.mcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; min-width: 0; }
.mstack { width: 100%; max-width: 38px; display: flex; flex-direction: column-reverse; border-radius: 9px; overflow: hidden; background: var(--soft); }
.mstack i { display: block; width: 100%; }
.mcol small { font-size: 11px; color: var(--muted); font-weight: 800; white-space: nowrap; }
.mcol b { font-size: 10.5px; font-weight: 900; white-space: nowrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; font-weight: 800; color: var(--muted); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--mc); margin-inline-end: 5px; vertical-align: -1px; }
.apt { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.apt:last-child { border-bottom: none; }
.apt .ic { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, var(--gold), var(--terra)); display: grid; place-items: center; flex: none; color: #fff; font-size: 20px; }
.apt .bd { flex: 1; min-width: 0; }
.apt .tt { font-weight: 900; overflow-wrap: anywhere; }
.apt a { color: var(--purple); font-weight: 800; font-size: 13px; overflow-wrap: anywhere; }
.miles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mile { text-align: center; padding: 10px 4px; border-radius: 14px; background: var(--soft); font-size: 11.5px; font-weight: 800; color: var(--muted); }
.mile svg { width: 30px; height: 30px; display: block; margin: 0 auto 4px; }
.mile.got { background: linear-gradient(160deg, color-mix(in srgb, var(--gold) 35%, var(--card)), color-mix(in srgb, var(--pink) 12%, var(--card))); color: var(--ink); }
.feed .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.feed .item:last-child { border-bottom: none; }
.feed .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: #fff; background: var(--mc); flex: none; }
.feed .txt { flex: 1; min-width: 0; font-size: 14px; }
.feed .when { font-size: 12px; color: var(--muted); font-weight: 700; }
.x { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 9px; padding: 3px 8px; font-size: 12px; cursor: pointer; flex: none; }
.pos { color: var(--teal); font-weight: 900; } .neg { color: var(--red); font-weight: 900; }
.feed .item.tapme { cursor: pointer; }
.feed .item.tapme:active { background: color-mix(in srgb, var(--mc) 10%, transparent); border-radius: 12px; }
.more { width: 100%; margin-top: 10px; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 9px; font-weight: 800; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.mrow { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .85fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-bottom: 10px; }
.mrow .del { border: 1.5px solid var(--line); background: var(--card); color: var(--red); border-radius: 12px; padding: 11px 11px; font-weight: 900; cursor: pointer; line-height: 1; }
.swatch { width: 14px; height: 14px; border-radius: 5px; display: inline-block; vertical-align: -2px; margin-inline-end: 5px; }

<script>
"use strict";
/* ==================== STORAGE ==================== */
const KEY = "DARNA_STATE_V1", PHOTO_KEY = "DARNA_PHOTO_V1", PREF_KEY = "DARNA_PREFS_V1", SYNC_KEY = "DARNA_SYNC_V1";
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function uid() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function n(v) { const x = parseFloat(v); return isFinite(x) ? x : 0; }
function pad(x) { return String(x).padStart(2, "0"); }
function ymd(d) { d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseYmd(s) { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

let S = null;
const COLORS = ["#12b39a", "#7b5cff", "#ff6b4a", "#ffb703", "#ff4f8b", "#4b5cff", "#1f9d55", "#c9962e"];
function freeColor() {
  const used = new Set((S && S.members ? S.members : []).map(m => m.color));
  return COLORS.find(c => !used.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
}
function defaults() {
  return {
    v: 1, city: "", goalMad: 300000, extraPct: 0,
    rates: { MAD: 1, USD: 9.8, QAR: 2.69, EUR: 10.7 },
    members: [
      { id: "kamal", name: "Kamal", ar: "كمال", cur: "MAD", color: "#12b39a", pledge: 0 },
      { id: "malika", name: "Malika", ar: "مليكة", f: true, cur: "USD", color: "#7b5cff", pledge: 0 },
      { id: "jazia", name: "Jazia", ar: "جازية", f: true, cur: "QAR", color: "#ff6b4a", pledge: 0 }
    ],
    setAt: 0, entries: [], deleted: {}, miles: {}, likes: {}, homes: [], msgs: [], rooms: {}, gone: {}, photoVer: ""
  };
}
function normalize() {
  const d = defaults();
  if (!S || typeof S !== "object") S = d;
  for (const k in d) if (S[k] === undefined) S[k] = d[k];
  S.rates = Object.assign({}, d.rates, S.rates || {});
  if (!Array.isArray(S.members) || !S.members.length) S.members = d.members;

/* ==================== MONEY ==================== */
function me() { const id = prefs().me; return S.members.find(m => m.id === id) || null; }
function viewCur() { const m = me(); return m ? m.cur : "MAD"; }
function rate(c) { return Math.max(0.0001, n(S.rates[c] || 1)); }
function toMad(amt, cur) { return n(amt) * rate(cur); }
function fromMad(v, cur) { return n(v) / rate(cur); }
const SYM = { USD: "$", EUR: "€" };
function money(v, cur) {
  const x = Math.round(n(v)).toLocaleString("en-US");
  if (cur === "USD" || cur === "EUR") return SYM[cur] + x;
  if (cur === "QAR") return x + (LANG === "ar" ? " ر.ق" : " QAR");
  return x + (LANG === "ar" ? " د" : " MAD");
}
function inView(mad) { return money(fromMad(mad, viewCur()), viewCur()); }
function goalMad() { return n(S.goalMad) * (1 + n(S.extraPct) / 100); }
function live() { return S.entries.filter(e => !S.deleted[e.id]); }
function eMad(e) { return (e.type === "withdraw" ? -1 : 1) * toMad(e.amt, e.cur); }
function totalMad() { return Math.max(0, live().reduce((a, e) => a + eMad(e), 0)); }
function memberMad(id) { return live().filter(e => e.by === id).reduce((a, e) => a + eMad(e), 0); }
function monthMad(id, mk) { mk = mk || ymd().slice(0, 7); return live().filter(e => e.d.slice(0, 7) === mk && (!id || e.by === id)).reduce((a, e) => a + eMad(e), 0); }
function pledgeMad() { return S.members.reduce((a, m) => a + toMad(m.pledge, m.cur), 0); }
function pace() {
  const L = live(); if (!L.length) return { val: pledgeMad(), real: false };
  const first = L.map(e => e.d).sort()[0], now = new Date(), from = new Date(now.getFullYear(), now.getMonth() - 2, 1);
  if ((now - parseYmd(first)) < 45 * 86400000) return { val: pledgeMad(), real: false };
  const start = parseYmd(first) > from ? parseYmd(first) : from, months = Math.max(1, (now - start) / (30.44 * 86400000));
  return { val: Math.max(0, L.filter(e => parseYmd(e.d) >= from).reduce((a, e) => a + eMad(e), 0) / months), real: true };
}
function monthName(d) { return d.toLocaleDateString(LANG === "ar" ? "ar-MA" : "en-US", { month: "long", year: "numeric" }); }
function shortDate(s) { return parseYmd(s).toLocaleDateString(LANG === "ar" ? "ar-MA" : "en-US", { month: "short", day: "numeric" }); }
function ago(s) { const d = Math.round((parseYmd(ymd()) - parseYmd(s)) / 86400000); return d <= 0 ? t("today") : d === 1 ? t("yesterday") : d < 8 ? t("{n} days ago", { n: d }) : shortDate(s); }

/* every contribution is seen on the house: it glows and the amount floats up */
function houseBurst(text) {
  buzz(18);
  const box = document.querySelector(".dream-in"), h = document.getElementById("house"); if (!box) return;
  const b = document.createElement("div"); b.className = "burst"; b.textContent = text; box.appendChild(b); setTimeout(() => b.remove(), 2300);
  h.classList.remove("flash"); void h.getBoundingClientRect(); h.classList.add("flash");
}
function stageOf(pct) { let i = 0; STAGES.forEach((st, k) => { if (pct >= st.at) i = k; }); return i; }
let houseShown = null, houseAnim = 0;
function renderHouse(pct) {
  // the whole home is always there as a see-through ghost; colour fills it from the ground up as we save
  const TOP = 40, BOT = 180, target = Math.max(0, Math.min(100, pct));
  const draw = v => {
    const h = v <= 0 ? 0 : Math.max(2.5, (BOT - TOP) * v / 100), y = BOT - h;
    const r = document.getElementById("fillRect"); r.setAttribute("y", y.toFixed(2)); r.setAttribute("height", h.toFixed(2));
    const ln = document.getElementById("fillLine"); ln.setAttribute("y", (y - 1.2).toFixed(2)); ln.setAttribute("opacity", v > 0 && v < 100 ? ".95" : "0");
  };
  const from = houseShown == null ? Math.max(0, target - 8) : houseShown;
  cancelAnimationFrame(houseAnim);
  if (Math.abs(target - from) < 0.01 || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) draw(target);
  else { const t0 = performance.now(), dur = 1400; const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); draw(from + (target - from) * e); if (k < 1) houseAnim = requestAnimationFrame(step); }; houseAnim = requestAnimationFrame(step); }
  houseShown = target;
  document.getElementById("hHeart").classList.toggle("on", pct >= 100);
  document.getElementById("litWin").setAttribute("opacity", pct >= 90 ? "1" : "0");
  const si = stageOf(pct), st = STAGES[si], nx = STAGES[si + 1];
  document.getElementById("stage").innerHTML = st.ic + " " + esc(LANG === "ar" ? st.ar : st.en) + (nx && st.at > 0 ? ' <span style="opacity:.75">· ' + esc(t("next at {p}", { p: nx.at + "%" })) + '</span>' : "");
  // a new stage reached since this phone last looked: celebrate once
  const P = prefs(), last = P.stage;
  if (last == null) setPref("stage", si);
  else if (si > last) { setPref("stage", si); setTimeout(() => { play("stage"); buzz([0, 40, 60, 40]); confetti(70); toast(t("New stage: {s}", { s: st.ic + " " + (LANG === "ar" ? st.ar : st.en) })); }, 600); }
  else if (si < last) setPref("stage", si);
}

/* ==================== APP UPDATES THROUGH THE FAMILY SYNC ====================
   One phone picks a new page file; it goes to Firestore as <code>-page, and every phone

const APP_BUILD = 1002; // raise with every new version of this file
let lastPageCheck = 0, pageBusy = false;

  setText("btnUpdNow", t("Update now")); setText("btnUpdLater", t("Later"));

function pageDocFields(j) { return (j && j.fields) || {}; }

    .then(r => (r.status === 404 ? null : readJson(r)))
    .then(j => {

      if (!b || b <= APP_BUILD) { pageBusy = false; if (st) st.textContent = t("You have the newest version ({n}).", { n: APP_BUILD }); return; }
      return fetch(docUrl("-page", "&mask.fieldPaths=html"), { cache: "no-store" }).then(readJson).then(j2 => {
        pageBusy = false;

function buildOfPage(html) { const m = /APP_BUILD\s*=\s*(\d+)/.exec(html || ""); return m ? parseInt(m[1], 10) : 0; }

function updateFromFile(ev) {

function shareOrDownload(text, name, mime) {
  const blob = new Blob([text], { type: mime });
  try { const file = new File([blob], name, { type: mime }); if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: name }).then(() => true).catch(() => false); } catch (e) {}
  const a = document.createElement("a"), u = URL.createObjectURL(blob); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
  return Promise.resolve(true);
}

}
function exportIcs() {
  const P = prefs(), day = n(P.remDay == null ? 5 : P.remDay), [hh, mm] = (P.remTime || "19:00").split(":").map(Number), BY = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
  const now = new Date(), first = new Date(now); first.setHours(hh, mm, 0, 0);
  while (first.getDay() !== day || first < now) first.setDate(first.getDate() + 1);
  const dt = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";

    "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + t("Darna: payday"), "TRIGGER:PT0M", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  shareOrDownload(ics, "darna-reminder.ics", "text/calendar").then(() => toast(t("Calendar file ready. Tap \"Add All\" to add the reminder.")));

/* ==================== SOUND & TOUCH ====================
   Short synthesized sounds, no files, so they work offline.
   The theme is a house being built: wood, bells and a small crowd cheering. */
const SND_KEY = "DARNA_SOUND_V1", VIB_KEY = "DARNA_VIB_V1";
function soundOn() { return prefs().sound !== false; }
function vibOn() { return prefs().vib !== false; }
function buzz(ms) { try { if (vibOn() && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
let actx = null, audioReady = false;
function ac() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}
// a browser only lets sound start after the person touches the screen
function unlockAudio() { if (audioReady) return; audioReady = true; const c = ac(); if (c) { const o = c.createOscillator(), g = c.createGain(); g.gain.value = 0.0001; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.01); } }
["pointerdown", "touchstart", "keydown"].forEach(e => document.addEventListener(e, unlockAudio, { once: true, passive: true }));

function voice(c, f, t, d, type, vol, toF) {
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(f, t);
  if (toF) o.frequency.exponentialRampToValueAtTime(Math.max(20, toF), t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol == null ? 0.1 : vol), t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + d + 0.03);
}
function bell(c, f, t, d, vol) {
  voice(c, f, t, d, "sine", vol == null ? 0.09 : vol);
  voice(c, f * 2.76, t, d * 0.5, "sine", (vol == null ? 0.09 : vol) * 0.28);
}
function thud(c, t, vol) {
  try {
    const n = Math.floor(c.sampleRate * 0.14), buf = c.createBuffer(1, n, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();

const SOUNDS = {

  nav: (c, t) => voice(c, 1174.7, t, 0.07, "sine", 0.05),

  // a contribution: a coin, then a brick settling into the wall

  // money arriving from a sister far away

  // a new building stage

  // a milestone: the whole family cheering

    [1046.5, 1318.5, 1568, 2093].forEach(f => bell(c, f, t + 0.62, 1.1, 0.07));
  },
  err: (c, t) => { voice(c, 311.1, t, 0.18, "triangle", 0.1); voice(c, 261.6, t + 0.11, 0.26, "triangle", 0.09); },
